<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
<button onclick="crear()">Crear</button>
<div id="divCont"></div>
<script>
function crear(){
  let divObj=document.createElement("div");
  divObj.style.width="100px";
  divObj.style.height="100px";
  divObj.style.backgroundColor="black";
  divObj.style.border="1px solid black";
  divObj.style.margin="10px";
  divObj.style.display="inline-block";
  divObj.addEventListener("mousedown",divPresionado);
  let divCon=document.getElementById("divCont");
  divCon.appendChild(divObj);
}
function divPresionado(e){
  switch(e.button){
    case 0: e.target.style.backgroundColor="red";break;
    case 1: e.target.style.backgroundColor="green";break;
    case 2: e.target.style.backgroundColor="blue";break;
  }
  
}
</script>
</body>
</html>
