    <body>
        <h1>1) Numero mayor de dos</h1>

        <label >Primer numero <input type="number" id="1num1"></label>
        <label >Segundo numero <input type="number" id="1num2"></label>
        <button onclick="nummayor()">Aceptar</button>
        <label >Numero mayor <input type="number" id="1mayor" readonly></label>
       

        <script>
            function nummayor(){
                let num1=parseFloat(document.getElementById("1num1").value);
                let num2=parseFloat(document.getElementById("1num2").value);
                if(num1>num2){
                    document.getElementById("1mayor").value=num1;
                }
                else{
                    document.getElementById("1mayor").value=num2;
                }
            }
        </script>
        <hr>

        <h1>2) Numeros ordenados de manera ascendente</h1>
        <label >Primer numero <input type="number" id="2num1"></label>
        <label >Segundo numero <input type="number" id="2num2"></label>
        <label >Tercer numero <input type="number" id="2num3"></label>
        <button onclick="ascendente()">Aceptar</button>
        <div id="2orden"></div>

        <script>
            function ascendente(){
                let num1=parseFloat(document.getElementById("2num1").value);
                let num2=parseFloat(document.getElementById("2num2").value);
                let num3=parseFloat(document.getElementById("2num3").value);
                let a="";

                if((num1<num2)&&(num1<num3)){
                    if(num2<num3){
                        a=num1+" "+num2+" "+num3; document.getElementById("2orden").innerText=a;
                    }
                    else{
                        a=num1+" "+num3+" "+num2; document.getElementById("2orden").innerText=a;
                    }
                }
                else if((num2<num1)&&(num2<num3)){
                    if(num3<num1){
                        a=num2+" "+num3+" "+num1; document.getElementById("2orden").innerText=a;
                    }
                    else{
                        a=num2+" "+num1+" "+num3; document.getElementById("2orden").innerText=a;
                    }
                }
                else{
                    if(num2<num1){
                        a=num3+" "+num2+" "+num1; document.getElementById("2orden").innerText=a;
                    }
                    else{
                        a=num3+" "+num1+" "+num2; document.getElementById("2orden").innerText=a;
                    }
                }
            }
        </script>
        <hr>

        <h1>3) Multiplo de 5</h1>
        <label >Numero <input type="number" id="3num"></label>
        <button onclick="multiplo()">Aceptar</button> 
        <h3 id="3respuesta"></h3>

        <script>
           function multiplo(){
            let num=parseFloat(document.getElementById("3num").value);
                if(num%5==0)
                {
                    document.getElementById("3respuesta").innerText="El numero es multiplo de 5";
                }
                else{
                    document.getElementById("3respuesta").innerText="El numero no es multiplo de 5";
                }

        <h1>4) Par o impar</h1>
        <label >Numero 1 <input type="number" id="4paroimpar"></label>
        <label >Numero 2 <input type="number" id="4paroimpar2"></label>
        <button onclick="parimpar()">Aceptar</button>
        <h3 id="4poi"></h3>
        
        <script>
            function parimpar(){
                let num1=parseFloat(document.getElementById("4paroimpar").value);
                let num2=parseFloat(document.getElementById("4paroimpar2").value);
                if(num1%2==0)
                {
                    if(num2%2==0){
                        document.getElementById("4poi").innerText="Los numeros "+num1+" y "+num2+" son pares";
                    }
                    else{
                        document.getElementById("4poi").innerText="El numero "+num1+" es par, "+" el numero "+num2+" es impar";
                    }
                    
                }
                else{
                    if(num2%2==0){
                        document.getElementById("4poi").innerText="El numero "+num2+" es par, "+" el numero "+num1+" es impar";
                    }
                    else{
                        document.getElementById("4poi").innerText="Los numeros "+num1+" y "+num2+" son impares";
                    }
                    
                }
            }
        </script>

        <h1>5) Hora</h1>
        <label >Horas <input type="number" id="5hora"></label>
        <label >Minutos <input type="number" id="5minutos"></label>
        <label >Segundos <input type="number" id="5segundos"></label>
        <button onclick="tiempo()">Aceptar</button>
        <div id="5tiempo"></div>

        <script>
            function tiempo(){
                let h=parseFloat(document.getElementById("5hora").value);
                let m=parseFloat(document.getElementById("5minutos").value);
                let s=parseFloat(document.getElementById("5segundos").value);
                let t="";

                if((s>59)||(s<0)||(m<0)||(m>59)||(h<0)||(h>23)){
                    document.getElementById("5tiempo").innerText="La hora introducida no es valida";
                }
                else{
                    if(s<59){
                    s=s+1;
                    t=h+":"+m+":"+s; document.getElementById("5tiempo").innerText=t;
                    }
                    else{
                        s=0;
                        if(m<59){
                            m=m+1;
                            t=h+":"+m+":"+s; document.getElementById("5tiempo").innerText=t;
                        }
                        else{
                            m=0;
                        
                            if(h<23){
                                h=h+1;
                                t=h+":"+m+":"+s; document.getElementById("5tiempo").innerText=t;
                            }
                            else{
                                h=0;
                                t=h+":"+m+":"+s; document.getElementById("5tiempo").innerText=t;
                            }
                        }
                    }

                }
            }
        </script>

        <label >Numero <input type="number" id="7paroimpar"></label>
        <button onclick="parimparne()">Aceptar</button>
        <h3 id="7poi"></h3>
        
        <script>
           function parimparne(){
                let num=parseFloat(document.getElementById("7paroimpar").value);
                if(((num>0)||(num<0))&&(num%2==0))

        <h1>9) Descuento (10% o 15%)</h1>
        <label >Monto:  <input type="number" id="9monto"></label>
        <button onclick="descuento()">Aceptar</button>
        <label >Precio con descuento <input type="number" id="9descuento" readonly></label>
        <script>
            function descuento(){
                let m=parseFloat(document.getElementById("9monto").value);
                let d=0, t=0;
                 if(m<10000){
                    d=m*0.10;
                    t=m-d;
                    document.getElementById("9descuento").value=t;
                 }
                 else{
                    d=m*0.15;
                    t=m-d;
                    document.getElementById("9descuento").value=t;
                 }
            }
        </script>
